name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check portfolio content
        run: pnpm test
      - name: Build website
        run: pnpm run build
        env:
          PORTFOLIO_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          PORTFOLIO_SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}/
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
